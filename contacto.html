<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto profesional de Sergio Alejandro Trigo Murillo.">
    <title>Contáctame</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="top-nav-container" role="banner">
        <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Abrir menú de navegación">
        <label for="nav-toggle" class="nav-toggle-btn" aria-hidden="true">&#9776; Menú</label>

        <nav aria-label="Navegación de retorno al inicio">
            <ul class="nav-links">
                <li><a href="index.html#datos-personales" class="btn-nav">Datos personales</a></li>
                <li><a href="index.html#perfil-profesional" class="btn-nav">Perfil profesional</a></li>
                <li><a href="index.html#trabajos" class="btn-nav">Trabajos y proyectos</a></li>
                <li><a href="index.html#habilidades" class="btn-nav">Nivel de conocimientos</a></li>
                <li>
                    <button type="button" id="btn-modo-oscuro" class="theme-toggle-btn" aria-label="Alternar entre modo claro y modo oscuro">
                        <span class="theme-icon">&#127769;</span> Modo Oscuro
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <hr class="separator-line">

    <main role="main" class="main-contacto">
        <section id="formulario-contacto" aria-labelledby="contacto-heading">
            <h1 id="contacto-heading" class="title-contacto">Datos para contactar</h1>

            <form action="#" method="post" enctype="application/x-www-form-urlencoded" class="contact-form">
                <fieldset>
                    <legend><strong>Datos del Solicitante</strong></legend>

                    <p class="form-group">
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" id="nombre" name="nombre" required minlength="3" maxlength="60" 
                               placeholder="Ej. Tunombre" aria-required="true" 
                               pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+">
                    </p>

                    <p class="form-group">
                        <label for="correo">Correo electrónico:</label>
                        <input type="email" id="correo" name="correo" required 
                               placeholder="ejemplo@correo.com" aria-required="true">
                    </p>

                    <p class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required 
                               pattern="(\+591|591)?[67][0-9]{7}" placeholder="+591 12345678" 
                               aria-describedby="tel-help" aria-required="true">
                        <small id="tel-help">Formato requerido: celular de 8 dígitos (ej. +591 12345678 o 12345678).</small>
                    </p>

                    <p class="form-group">
                        <label for="motivo">Motivo de contacto:</label>
                        <select id="motivo" name="motivo" required aria-required="true">
                            <option value="" disabled selected>Seleccione una opción</option>
                            <option value="oferta-laboral">Oferta laboral</option>
                            <option value="proyecto-freelance">Proyecto independiente</option>
                            <option value="academico">Académico</option>
                            <option value="otro">Otro motivo</option>
                        </select>
                    </p>

                    <p class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" cols="40" required 
                                  minlength="10" maxlength="500" 
                                  placeholder="Escriba los motivos por los que desea contactarse conmigo..." 
                                  aria-required="true"></textarea>
                    </p>

                    <p class="form-group-checkbox">
                        <input type="checkbox" id="consentimiento" name="consentimiento" required aria-required="true">
                        <label for="consentimiento">Autorizo el uso de estos datos para responder a esta consulta</label>
                    </p>
                </fieldset>

                <p class="buttons-container">
                    <button type="submit" class="btn-action btn-submit"><strong>Enviar Mensaje</strong></button>
                    <button type="reset" class="btn-action btn-reset">Limpiar Campos</button>
                </p>
            </form>
        </section>
    </main>

    <footer role="contentinfo">
        <p><small>&copy; 2026 Sergio Alejandro Trigo Murillo. Todos los derechos reservados.</small></p>
    </footer>
<script src="js/theme.js"></script>
<script src="js/validacion.js"></script>
</body>

</html>
